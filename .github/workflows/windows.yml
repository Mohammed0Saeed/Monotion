name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build app
        run: |
          python -m pip install -r desktop/requirements.txt
          pyinstaller desktop/monotion.spec --noconfirm --distpath dist --workpath build
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          $env:MONOTION_VERSION = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" desktop/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Monotion-Setup
          path: dist/Monotion-Setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Monotion-Setup.exe
